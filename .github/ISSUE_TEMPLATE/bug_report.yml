name: Bug report
description: Report an installation, restore, font, or text-direction problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: checkboxes
    attributes:
      label: Safety check
      options:
        - label: I removed credentials and personal paths from logs.
          required: true
  - type: input
    attributes:
      label: OpenCode Desktop version
      placeholder: 1.18.5
    validations:
      required: true
  - type: input
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    attributes:
      label: PowerShell and Node.js versions
      placeholder: PowerShell 5.1, Node.js 20
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Operation
      options:
        - Install
        - Restore
        - Runtime text direction
        - Font rendering
    validations:
      required: true
  - type: textarea
    attributes:
      label: What happened?
      description: Include reproducible steps and sanitized output.
    validations:
      required: true
